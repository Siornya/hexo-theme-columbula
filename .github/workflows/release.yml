name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Archive theme
        run: zip -r columbula-${{ github.ref_name }}.zip . -x "*.git*"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: columbula-${{ github.ref_name }}.zip
